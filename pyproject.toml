[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "berkeley_humanoid_lite_lowlevel"
version = "2025.09.07"
description = "Low-level control for Berkeley Humanoid Lite"
authors = [
    { name = "Berkeley Humanoid Project Developers" },
    { name = "-T.K.-" },
]
maintainers = [
    { name = "Berkeley Humanoid Project Developers" },
    { name = "-T.K.-" },
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["robotics", "lowlevel"]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "cc.udp",
    "inputs",
    "loop-rate-limiters",
    "numpy",
    "omegaconf",
    "psutil",
    "pyserial",
    "python-can",
    "PyYAML",
]

[project.optional-dependencies]
rl = [
    "onnxruntime",
    "torch",
]
tools = [
    "scipy",
]

[project.urls]
repository = "https://github.com/HybridRobotics/Berkeley-Humanoid-Lite-Lowlevel"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["berkeley_humanoid_lite_lowlevel*"]
